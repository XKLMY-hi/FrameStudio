<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="416" viewBox="0 0 1440 416" role="img" aria-labelledby="title desc">
  <title id="title">FrameStudio</title>
  <desc id="desc">Live2D 动画、场景打光与镜头编排。琥珀色聚光灯照亮画幅中的表演者标记。</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#181a1e"/>
      <stop offset=".52" stop-color="#0d0e10"/>
      <stop offset="1" stop-color="#131418"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#eaa964" stop-opacity=".17"/>
      <stop offset="1" stop-color="#eaa964" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x2=".72" y2="1">
      <stop stop-color="#353941"/>
      <stop offset=".6" stop-color="#1b1d20"/>
      <stop offset="1" stop-color="#141314"/>
    </linearGradient>
    <linearGradient id="beam" x2="0" y2="1">
      <stop stop-color="#ffbc73"/>
      <stop offset=".67" stop-color="#dc9b59" stop-opacity=".50"/>
      <stop offset="1" stop-color="#eea759" stop-opacity=".20"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#24262b" stroke-width="1"/>
    </pattern>
    <linearGradient id="grid-fade" x2="1" y2="0">
      <stop stop-color="#000"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect x="728" y="33" width="678" height="350" fill="url(#grid-fade)"/>
    </mask>
    <clipPath id="aperture"><rect x="954" y="123" width="174" height="174" rx="41"/></clipPath>
  </defs>

  <rect width="1440" height="416" fill="url(#surface)"/>
  <rect x="32.5" y="32.5" width="1375" height="351" rx="7" fill="none" stroke="#2b2d32"/>
  <rect x="728" y="33" width="678" height="350" fill="url(#grid)" mask="url(#grid-mask)"/>
  <ellipse cx="1041" cy="267" rx="353" ry="147" fill="url(#glow)"/>
  <path d="M32.5 53V32.5H53M1387 32.5h20.5V53M32.5 363v20.5H53m1334 0h20.5V363"
        fill="none" stroke="#5c6067"/>

  <g font-family="Consolas, monospace">
    <circle cx="87" cy="98" r="4" fill="#f5b46d"/>
    <text x="104" y="104" fill="#f1bb85" font-size="16" letter-spacing="2.8">LIVE2D STAGE SOFTWARE</text>
    <path d="M84 294h42m9 0h11" stroke="#cf935c" stroke-opacity=".72"/>
    <text x="82" y="337" fill="#a6a8ae" font-size="14" letter-spacing="1.8">TIMELINE  /  LIGHTING  /  CAMERA</text>
  </g>
  <text x="77" y="208" fill="#f6f3ee" font-family="Segoe UI, sans-serif" font-size="104" letter-spacing="-4.8"><tspan font-weight="700">Frame</tspan><tspan font-weight="300">Studio</tspan></text>
  <text x="84" y="257" fill="#c7c8cc" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" letter-spacing="1">Live2D 动画、场景打光与镜头编排</text>

  <g fill="none" stroke="#797b82">
    <path d="M1041 56v15m0 278v14M881 210h20m280 0h20" stroke-opacity=".64"/>
    <path d="M891 102V74h28m244 0h28v28M891 318v28h28m244 0h28v-28" stroke-opacity=".54"/>
  </g>
  <rect x="911" y="88" width="260" height="244" rx="51" fill="#070708" opacity=".38" transform="translate(0 6)"/>
  <rect x="919" y="88" width="244" height="244" rx="50" fill="url(#frame)" stroke="#505157" stroke-width="1.4"/>
  <rect x="954" y="123" width="174" height="174" rx="41" fill="#17171a"/>
  <g clip-path="url(#aperture)">
    <path d="M1024 153h34l55 144H969z" fill="url(#beam)"/>
    <ellipse cx="1041" cy="277" rx="83" ry="35" fill="url(#glow)"/>
    <ellipse cx="1041" cy="275" rx="31" ry="5" fill="#edb578" opacity=".27"/>
    <rect x="1025" y="149" width="32" height="8" rx="4" fill="#ffe5c5"/>
    <circle cx="1041" cy="243" r="13" fill="#fff4e5"/>
  </g>
  <rect x="954" y="123" width="174" height="174" rx="41" fill="none" stroke="#f2eee5" stroke-width="8"/>
  <g fill="#96989e" font-family="Consolas, monospace" font-size="12" letter-spacing="1.6">
    <text x="1225" y="201">01 / STAGE</text>
    <text x="1225" y="223">FRAME · LIGHT</text>
  </g>
</svg>
